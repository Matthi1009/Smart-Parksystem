<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking Dashboard</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #3b82f6; --success: #22c55e; --danger: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; padding: 40px; }
        .container { max-width: 800px; width: 100%; }
        .header { background: var(--card); padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 30px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .big-val { font-size: 4rem; font-weight: bold; margin: 10px 0; color: var(--primary); }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #475569; }
        #log { background: #000; padding: 15px; border-radius: 8px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; margin-top: 20px; text-align: left; }
        .status-tag { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; background: var(--danger); }
        .status-tag.on { background: var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 style="margin:0; font-size: 1.2rem;">Smart Parking Control</h1>
                <span id="connShow" class="status-tag">Nicht verbunden</span>
            </div>
            <button id="connectBtn" class="btn">Gerät verbinden (USB)</button>
        </div>

        <div class="grid">
            <div class="card">
                <div style="color: #94a3b8; text-transform: uppercase; font-size: 0.8rem;">Freie Plätze</div>
                <div id="freeDisp" class="big-val">--</div>
                <div id="totalDisp" style="color: #64748b;">von -- Plätzen</div>
            </div>
            <div class="card">
                <div style="color: #94a3b8; text-transform: uppercase; font-size: 0.8rem;">Schranke</div>
                <div id="barrierDisp" class="big-val" style="color: var(--danger);">ZU</div>
                <div id="eventDisp" style="color: #64748b;">Warte auf Daten...</div>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <div style="text-align: left; color: #94a3b8; font-size: 0.8rem; margin-bottom: 10px;">System-Aktivität</div>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let port;
        const connectBtn = document.getElementById('connectBtn');
        const log = document.getElementById('log');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                document.getElementById('connShow').innerText = "Verbunden";
                document.getElementById('connShow').classList.add('on');
                connectBtn.disabled = true;
                addLog("Verbindung zum ESP32 hergestellt.");
                
                readData();
            } catch (e) {
                addLog("Fehler: " + e);
            }
        });

        async function readData() {
            const decoder = new TextDecoder();
            let buffer = "";
            
            while (port.readable) {
                const reader = port.readable.getReader();
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value);
                        let lines = buffer.split("\n");
                        buffer = lines.pop();

                        for (let line of lines) {
                            if (line.trim().startsWith("STATUS:")) {
                                try {
                                    let jsonStr = line.replace("STATUS:", "").trim();
                                    let data = JSON.parse(jsonStr);
                                    updateUI(data);
                                } catch (err) {
                                    console.log("JSON Fehler", err);
                                }
                            }
                        }
                    }
                } finally {
                    reader.releaseLock();
                }
            }
        }

        function updateUI(data) {
            document.getElementById('freeDisp').innerText = data.free;
            document.getElementById('totalDisp').innerText = "von " + data.total + " Plätzen";
            
            const b = document.getElementById('barrierDisp');
            if (data.barrier === "open") {
                b.innerText = "OFFEN";
                b.style.color = "var(--success)";
            } else {
                b.innerText = "ZU";
                b.style.color = "var(--danger)";
            }

            if (data.event && data.event !== "Update") {
                document.getElementById('eventDisp').innerText = data.event;
                addLog(data.event);
            }
        }

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            log.innerHTML = `<div><span style="color: #64748b;">[${time}]</span> ${msg}</div>` + log.innerHTML;
        }
    </script>
</body>
</html>
